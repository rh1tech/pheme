# Pheme local infrastructure: MongoDB, RabbitMQ, Redis.
# Copy .env.example to .env and adjust as needed, then: docker compose up -d
name: pheme

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in deploy/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?set MONGO_PASS in deploy/.env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pheme}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBIT_HOST_PORT:-5672}:5672"   # AMQP
      - "127.0.0.1:${RABBIT_MGMT_HOST_PORT:-15672}:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?set RABBIT_USER in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?set RABBIT_PASS in deploy/.env}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  rabbit-data:
  redis-data:
