# SUPERSEDED — do not apply. See pheme-prod-api.rh1.tech.conf and
# deploy/nginx/README.md; the API now mounts under an unlisted path prefix
# generated by render.sh.
server {
    client_max_body_size 100M;
    server_name pheme-dev-api.rh1.tech;
    access_log /var/log/nginx/pheme-dev-api.rh1.tech_access.log;
    error_log /var/log/nginx/pheme-dev-api.rh1.tech_error.log;

    # Public website triggers -> ingest service.
    location /v1/ingest/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8197;
    }

    # Live SSE stream -> app service (no buffering, long-lived).
    location /v1/stream {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8196;
    }

    # Everything else -> app service.
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8196;
    }

    listen 443 ssl;
    include /etc/nginx/snippets/rh1-tech-ssl.conf;
}
server {
    if ($host = pheme-dev-api.rh1.tech) {
        return 301 https://$host$request_uri;
    }
    server_name pheme-dev-api.rh1.tech;
    listen 80;
    return 404;
}
