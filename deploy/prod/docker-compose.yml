# Production Pheme stack (one environment per Compose project).
#
# Run with, e.g.:
#   docker compose -p pheme-prod --env-file /opt/pheme/prod/stack.env \
#     -f docker-compose.yml up -d
#
# Infra (mongo/rabbitmq/redis) is internal-only. The web, app and ingest
# services bind to 127.0.0.1 so the host nginx can reverse-proxy them with TLS.
name: pheme

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &service_env
      PHEME_STORE_DRIVER: mongo
      # Message images are stored in MongoDB GridFS (same Mongo as the store).
      PHEME_BLOB_DRIVER: gridfs
      PHEME_BROKER_DRIVER: rabbit
      PHEME_LIVE_DRIVER: redis
      PHEME_RATELIMIT_DRIVER: redis
      # The APP sends chat notifications itself — a conversation message is pushed straight from
      # the request path (chat.notifyMembers), not handed to the dispatcher. So the app needs FCM
      # too, and for a long time it did not: this was hardcoded to `webpush`, the FCM sender was
      # therefore never built here, and EVERY Android device was silently skipped for every chat
      # message. Web push worked, so nothing looked broken.
      #
      # The dispatcher's comment ("only the dispatcher fans out") was true when it was written and
      # stopped being true when chat arrived.
      PHEME_PUSH_DRIVER: ${PHEME_PUSH_DRIVER:-webpush}
      PHEME_FCM_CREDENTIALS: /run/secrets/fcm-service-account.json
      # APNs, for iOS VoIP pushes ONLY — the ringing call screen. FCM carries every other iOS
      # notification but cannot reach PushKit, so a call needs a direct APNs connection.
      #
      # All four empty is a supported deployment, not a broken one: bootstrap.voip() logs and
      # returns nil, and an iPhone then gets an ordinary alert for an incoming call — a banner
      # instead of a ring. That is exactly how this host ran until now.
      #
      # PHEME_APNS_PRODUCTION must match the aps-environment the APP was signed with. A token
      # minted against one gateway is rejected by the other with BadDeviceToken, and that is the
      # single most common reason a VoIP push silently never arrives. Debug and Profile builds are
      # signed `development` (sandbox, so false); only a Release build is `production`.
      PHEME_APNS_KEY_FILE: ${PHEME_APNS_KEY_FILE:-}
      PHEME_APNS_KEY_ID: ${PHEME_APNS_KEY_ID:-}
      PHEME_APNS_TEAM_ID: ${PHEME_APNS_TEAM_ID:-}
      PHEME_APNS_BUNDLE_ID: ${PHEME_APNS_BUNDLE_ID:-}
      PHEME_APNS_PRODUCTION: ${PHEME_APNS_PRODUCTION:-false}
      PHEME_MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      PHEME_MONGO_DB: pheme
      # Absolute App API base for image URLs in push notifications (reuses the
      # same public API base the web container is built against).
      PHEME_PUBLIC_API_URL: ${PHEME_API_BASE}
      PHEME_RABBIT_URI: "amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/"
      PHEME_REDIS_ADDR: "redis:6379"
      PHEME_JWT_SECRET: ${PHEME_JWT_SECRET}
      # This host's own identity: issuer of its tokens, and in a federated
      # network the name its nodelist entry is filed under.
      PHEME_HOST_DOMAIN: ${PHEME_HOST_DOMAIN:-}
      PHEME_HOST_KEY: ${PHEME_HOST_KEY:-}
      # The signed roster of the federated network, and the coordinator key
      # that vouches for it. Both empty keeps this host standalone.
      PHEME_NODELIST_COORD_KEY: ${PHEME_NODELIST_COORD_KEY:-}
      PHEME_NODELIST_PATH: ${PHEME_NODELIST_PATH:-}
      # Browser origins allowed to call this API. The web SPA is served from a
      # different host than the API, so it genuinely needs CORS — but only for
      # that one origin. Anything unlisted gets no CORS headers at all.
      PHEME_CORS_ORIGINS: ${PHEME_WEB_ORIGIN}
      PHEME_ADMIN_EMAILS: ${PHEME_ADMIN_EMAILS}
      PHEME_VAPID_PUBLIC: ${PHEME_VAPID_PUBLIC}
      PHEME_VAPID_PRIVATE: ${PHEME_VAPID_PRIVATE}
      PHEME_VAPID_SUBJECT: ${PHEME_VAPID_SUBJECT}
      # 1:1 voice calls. The API hands clients a STUN/TURN list with a short-lived
      # credential derived from PHEME_TURN_SECRET, which must match coturn's
      # static-auth-secret. Leave the URLs empty to switch calling off entirely — the
      # endpoint then refuses rather than shipping a feature that fails behind NAT.
      PHEME_TURN_URLS: ${PHEME_TURN_URLS:-}
      PHEME_TURN_SECRET: ${PHEME_TURN_SECRET:-}
      # Email verification / password reset. Only the app binary sends mail; it
      # relays through the host's Postfix (host.docker.internal → host-gateway),
      # which DKIM-signs and delivers direct-to-MX. Verification state lives in
      # Redis so it is shared across app instances.
      PHEME_OTP_DRIVER: redis
      PHEME_MAIL_DRIVER: ${PHEME_MAIL_DRIVER:-smtp}
      PHEME_SMTP_HOST: ${PHEME_SMTP_HOST:-host.docker.internal}
      PHEME_SMTP_PORT: ${PHEME_SMTP_PORT:-25}
      PHEME_SMTP_FROM: ${PHEME_SMTP_FROM:-Pheme <noreply@app.example.com>}
      # The host Postfix presents its relay.example.com cert, which won't match
      # host.docker.internal; the hop is on the private docker bridge, so skip
      # STARTTLS verification for it (outbound MX TLS is unaffected).
      PHEME_SMTP_INSECURE_TLS: ${PHEME_SMTP_INSECURE_TLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:8080"

    volumes:
      # The same Firebase service-account key the dispatcher mounts. See the note there for the
      # ownership the distroless non-root user (uid 65532) needs.
      - ${PHEME_FCM_CREDENTIALS_HOST:-/opt/pheme/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro
      # The APNs .p8 signing key, same ownership rules as the file above. The default points at a
      # placeholder that need not exist as a real key: with PHEME_APNS_KEY_FILE unset the app never
      # opens it, so a host with no APNs key mounts a harmless empty file — the same trick the
      # nodelist below uses.
      - ${PHEME_APNS_KEY_HOST:-/opt/pheme/no-apns-key.p8}:/run/secrets/apns-key.p8:ro
      # The signed nodelist, for a host that has joined a federated network. A
      # standalone host leaves PHEME_NODELIST_FILE unset and this mounts a harmless
      # empty placeholder that the app never reads (PHEME_NODELIST_PATH is unset too).
      - ${PHEME_NODELIST_FILE:-/opt/pheme/no-nodelist.json}:/nodelist.json:ro

  ingest:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-ingest"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *service_env
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT}:8081"

  dispatcher:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-dispatcher"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *service_env
      # Mobile push via FCM, in addition to Web Push. Enabled per-env by setting
      # PHEME_PUSH_DRIVER=both in that env's stack.env; defaults to webpush so an environment
      # without FCM configured is unaffected. The app service needs the same pair — see there.
      PHEME_PUSH_DRIVER: ${PHEME_PUSH_DRIVER:-webpush}
      PHEME_FCM_CREDENTIALS: /run/secrets/fcm-service-account.json
    volumes:
      # Firebase service-account key. Place it on the host and point
      # PHEME_FCM_CREDENTIALS_HOST at it in stack.env. The API image runs as the
      # distroless non-root user (uid 65532), so make the file readable by it
      # WITHOUT exposing it to other host users:
      #   sudo chown 65532:65532 <file> && sudo chmod 600 <file>
      # Keep it out of git.
      - ${PHEME_FCM_CREDENTIALS_HOST:-/opt/pheme/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro
      # The APNs .p8, same ownership rules. See the app service for why the default is a placeholder.
      - ${PHEME_APNS_KEY_HOST:-/opt/pheme/no-apns-key.p8}:/run/secrets/apns-key.p8:ro

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      PHEME_API_BASE: ${PHEME_API_BASE}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"

  # STUN + TURN for 1:1 voice calls. Media is peer to peer and never touches this
  # machine — except for the minority of calls whose two ends cannot reach each other
  # directly at all, which TURN relays. See turnserver.conf.
  #
  # This is the only service here that is NOT bound to 127.0.0.1, and it cannot be: TURN
  # is not HTTP, so the host nginx cannot reverse-proxy it. `network_mode: host` is
  # deliberate — coturn needs the real host address to generate reachable candidates, and
  # a UDP relay range published through Docker's userland proxy performs badly.
  #
  # Requires on the host firewall: 3478/udp, 3478/tcp, 5349/tcp, 49160-49200/udp.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # Opt-in. It stays down until the host is actually ready for it — the firewall open on
    # 3478/5349 and the relay range, a real PHEME_TURN_SECRET, and a certificate it can read.
    # Starting it before any of that would give a restart loop and an open relay, so a deploy
    # that has not been prepared for calling simply does not bring it up.
    #
    # Turn it on with COMPOSE_PROFILES=calls in the environment file.
    profiles: ["calls"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # The TLS-TURN certificate, for `turns:` on 5349. NOT /etc/letsencrypt: coturn runs as
      # nobody and cannot read it (0700 root), and mounting `live/` alone would hand the
      # container a directory of dangling symlinks into `archive/`. A certbot deploy hook
      # publishes a readable copy here and restarts this container on renewal — see
      # turnserver.conf, which explains why the restart is not optional.
      - ${PHEME_TURN_CERT_DIR:-/opt/pheme/prod/turn-certs}:/certs:ro
    # The realm and the shared secret are passed here, not in turnserver.conf: that file is
    # in git and coturn does not expand environment variables. The secret must be the same
    # one the App API signs credentials with (PHEME_TURN_SECRET).
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${PHEME_TURN_REALM:-app.example.com}"
      - "--static-auth-secret=${PHEME_TURN_SECRET:-}"

volumes:
  mongo-data:
  rabbit-data:
  redis-data:
