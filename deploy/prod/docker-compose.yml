# Production Pheme stack (one environment per Compose project).
#
# Run with, e.g.:
#   docker compose -p pheme-prod --env-file /opt/pheme/prod/stack.env \
#     -f docker-compose.yml up -d
#
# Infra (mongo/rabbitmq/redis) is internal-only. The web, app and ingest
# services bind to 127.0.0.1 so the host nginx can reverse-proxy them with TLS.
name: pheme

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &service_env
      PHEME_STORE_DRIVER: mongo
      PHEME_BROKER_DRIVER: rabbit
      PHEME_LIVE_DRIVER: redis
      PHEME_RATELIMIT_DRIVER: redis
      PHEME_PUSH_DRIVER: webpush
      PHEME_MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      PHEME_MONGO_DB: pheme
      PHEME_RABBIT_URI: "amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/"
      PHEME_REDIS_ADDR: "redis:6379"
      PHEME_JWT_SECRET: ${PHEME_JWT_SECRET}
      PHEME_ADMIN_EMAILS: ${PHEME_ADMIN_EMAILS}
      PHEME_VAPID_PUBLIC: ${PHEME_VAPID_PUBLIC}
      PHEME_VAPID_PRIVATE: ${PHEME_VAPID_PRIVATE}
      PHEME_VAPID_SUBJECT: ${PHEME_VAPID_SUBJECT}
      # Email verification / password reset. Only the app binary sends mail; it
      # relays through the host's Postfix (host.docker.internal → host-gateway),
      # which DKIM-signs and delivers direct-to-MX. Verification state lives in
      # Redis so it is shared across app instances.
      PHEME_OTP_DRIVER: redis
      PHEME_MAIL_DRIVER: ${PHEME_MAIL_DRIVER:-smtp}
      PHEME_SMTP_HOST: ${PHEME_SMTP_HOST:-host.docker.internal}
      PHEME_SMTP_PORT: ${PHEME_SMTP_PORT:-25}
      PHEME_SMTP_FROM: ${PHEME_SMTP_FROM:-Pheme <noreply@app.example.com>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:8080"

  ingest:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-ingest"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *service_env
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT}:8081"

  dispatcher:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-dispatcher"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *service_env
      # Mobile push via FCM (in addition to Web Push). Only the dispatcher fans
      # out, so FCM credentials live here and nowhere else. Enabled per-env by
      # setting PHEME_PUSH_DRIVER=both in that env's stack.env; defaults to
      # webpush so environments without FCM configured are unaffected.
      PHEME_PUSH_DRIVER: ${PHEME_PUSH_DRIVER:-webpush}
      PHEME_FCM_CREDENTIALS: /run/secrets/fcm-service-account.json
    volumes:
      # Firebase service-account key. Place it on the host and point
      # PHEME_FCM_CREDENTIALS_HOST at it in stack.env. The API image runs as the
      # distroless non-root user (uid 65532), so make the file readable by it
      # WITHOUT exposing it to other host users:
      #   sudo chown 65532:65532 <file> && sudo chmod 600 <file>
      # Keep it out of git.
      - ${PHEME_FCM_CREDENTIALS_HOST:-/opt/pheme/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      PHEME_API_BASE: ${PHEME_API_BASE}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"

volumes:
  mongo-data:
  rabbit-data:
  redis-data:
