# Production Pheme stack (one environment per Compose project).
#
# Run with, e.g.:
#   docker compose -p pheme-prod --env-file /opt/pheme/prod/stack.env \
#     -f docker-compose.yml up -d
#
# Infra (mongo/rabbitmq/redis) is internal-only. The web, app and ingest
# services bind to 127.0.0.1 so the host nginx can reverse-proxy them with TLS.
name: pheme

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &service_env
      PHEME_STORE_DRIVER: mongo
      # Message images are stored in MongoDB GridFS (same Mongo as the store).
      PHEME_BLOB_DRIVER: gridfs
      PHEME_BROKER_DRIVER: rabbit
      PHEME_LIVE_DRIVER: redis
      PHEME_RATELIMIT_DRIVER: redis
      PHEME_PUSH_DRIVER: webpush
      PHEME_MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      PHEME_MONGO_DB: pheme
      # Absolute App API base for image URLs in push notifications (reuses the
      # same public API base the web container is built against).
      PHEME_PUBLIC_API_URL: ${PHEME_API_BASE}
      PHEME_RABBIT_URI: "amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/"
      PHEME_REDIS_ADDR: "redis:6379"
      PHEME_JWT_SECRET: ${PHEME_JWT_SECRET}
      PHEME_ADMIN_EMAILS: ${PHEME_ADMIN_EMAILS}
      PHEME_VAPID_PUBLIC: ${PHEME_VAPID_PUBLIC}
      PHEME_VAPID_PRIVATE: ${PHEME_VAPID_PRIVATE}
      PHEME_VAPID_SUBJECT: ${PHEME_VAPID_SUBJECT}
      # 1:1 voice calls. The API hands clients a STUN/TURN list with a short-lived
      # credential derived from PHEME_TURN_SECRET, which must match coturn's
      # static-auth-secret. Leave the URLs empty to switch calling off entirely — the
      # endpoint then refuses rather than shipping a feature that fails behind NAT.
      PHEME_TURN_URLS: ${PHEME_TURN_URLS:-}
      PHEME_TURN_SECRET: ${PHEME_TURN_SECRET:-}
      # Email verification / password reset. Only the app binary sends mail; it
      # relays through the host's Postfix (host.docker.internal → host-gateway),
      # which DKIM-signs and delivers direct-to-MX. Verification state lives in
      # Redis so it is shared across app instances.
      PHEME_OTP_DRIVER: redis
      PHEME_MAIL_DRIVER: ${PHEME_MAIL_DRIVER:-smtp}
      PHEME_SMTP_HOST: ${PHEME_SMTP_HOST:-host.docker.internal}
      PHEME_SMTP_PORT: ${PHEME_SMTP_PORT:-25}
      PHEME_SMTP_FROM: ${PHEME_SMTP_FROM:-Pheme <noreply@app.example.com>}
      # The host Postfix presents its relay.example.com cert, which won't match
      # host.docker.internal; the hop is on the private docker bridge, so skip
      # STARTTLS verification for it (outbound MX TLS is unaffected).
      PHEME_SMTP_INSECURE_TLS: ${PHEME_SMTP_INSECURE_TLS:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:8080"

  ingest:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-ingest"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *service_env
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT}:8081"

  dispatcher:
    image: ${API_IMAGE}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-dispatcher"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *service_env
      # Mobile push via FCM (in addition to Web Push). Only the dispatcher fans
      # out, so FCM credentials live here and nowhere else. Enabled per-env by
      # setting PHEME_PUSH_DRIVER=both in that env's stack.env; defaults to
      # webpush so environments without FCM configured are unaffected.
      PHEME_PUSH_DRIVER: ${PHEME_PUSH_DRIVER:-webpush}
      PHEME_FCM_CREDENTIALS: /run/secrets/fcm-service-account.json
    volumes:
      # Firebase service-account key. Place it on the host and point
      # PHEME_FCM_CREDENTIALS_HOST at it in stack.env. The API image runs as the
      # distroless non-root user (uid 65532), so make the file readable by it
      # WITHOUT exposing it to other host users:
      #   sudo chown 65532:65532 <file> && sudo chmod 600 <file>
      # Keep it out of git.
      - ${PHEME_FCM_CREDENTIALS_HOST:-/opt/pheme/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      PHEME_API_BASE: ${PHEME_API_BASE}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:80"

  # STUN + TURN for 1:1 voice calls. Media is peer to peer and never touches this
  # machine — except for the minority of calls whose two ends cannot reach each other
  # directly at all, which TURN relays. See turnserver.conf.
  #
  # This is the only service here that is NOT bound to 127.0.0.1, and it cannot be: TURN
  # is not HTTP, so the host nginx cannot reverse-proxy it. `network_mode: host` is
  # deliberate — coturn needs the real host address to generate reachable candidates, and
  # a UDP relay range published through Docker's userland proxy performs badly.
  #
  # Requires on the host firewall: 3478/udp, 3478/tcp, 5349/tcp, 49160-49200/udp.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # Opt-in. It stays down until the host is actually ready for it — the firewall open on
    # 3478/5349 and the relay range, a real PHEME_TURN_SECRET, and a certificate it can read.
    # Starting it before any of that would give a restart loop and an open relay, so a deploy
    # that has not been prepared for calling simply does not bring it up.
    #
    # Turn it on with COMPOSE_PROFILES=calls in the environment file.
    profiles: ["calls"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # coturn reads the PEMs directly (it does not go through nginx), and does NOT
      # reliably reload them on SIGHUP — add a certbot deploy-hook that restarts this
      # container or TLS-TURN dies silently at the first renewal.
      - ${PHEME_TURN_CERT_DIR:-/etc/letsencrypt/live/app.example.com}:/certs:ro
    # The realm and the shared secret are passed here, not in turnserver.conf: that file is
    # in git and coturn does not expand environment variables. The secret must be the same
    # one the App API signs credentials with (PHEME_TURN_SECRET).
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${PHEME_TURN_REALM:-app.example.com}"
      - "--static-auth-secret=${PHEME_TURN_SECRET:-}"

volumes:
  mongo-data:
  rabbit-data:
  redis-data:
