# coturn — STUN + TURN for Pheme's 1:1 voice calls.
#
# Calls are peer to peer: media never touches this machine. This server exists for two
# things only:
#
#   STUN — tells a browser its own public address so it can find its peer directly.
#          Stateless, a few packets, effectively free.
#   TURN — relays the media for the pairs that CANNOT reach each other directly at all
#          (symmetric NAT, which is most mobile carriers). This is the one and only path
#          by which call media transits our hardware, and it applies to a minority of
#          calls. Budget ~100 kbps / ~50 MB per hour for each relayed call.
#
# Deployed with `network_mode: host`: TURN needs the real host address to generate usable
# candidates, and publishing a UDP relay range through Docker's userland proxy does not
# work well. It is the only service in this stack that binds public ports.

listening-port=3478

# The relay port range. Forty ports is ample for 1:1 voice (a relayed call takes a couple)
# and avoids the usual advice of opening 16,000 of them.
min-port=49160
max-port=49200

fingerprint

# --- credentials -------------------------------------------------------------
#
# No user database. In `use-auth-secret` mode coturn accepts any username of the form
# "<unix-expiry>" whose password is base64(HMAC-SHA1(secret, username)). The App API mints
# those on demand (GET /v1/calls/ice-servers) with no state and no round trip to coturn,
# and the secret itself never leaves the server. A credential that leaks expires on its
# own and cannot be reversed into the secret.
#
# `realm` and `static-auth-secret` are NOT set here: this file is in git, and coturn does
# not expand environment variables. They are passed on the command line from the compose
# file instead, out of ${PHEME_TURN_REALM} and ${PHEME_TURN_SECRET}. The secret must match
# what the App API is given, or every relayed call fails authentication — silently, because
# the browser only ever reports "no candidate pair".
use-auth-secret
stale-nonce=600

# --- TLS: deliberately OFF ---------------------------------------------------
#
# `turns:` on 5349 would rescue users on networks that block UDP and non-standard TCP ports
# outright. It is not configured, and it cannot be with the certificate this host has.
#
# The site sits behind Cloudflare, and nginx serves a Cloudflare ORIGIN certificate — issued
# by Cloudflare's own CA, trusted by Cloudflare and by nobody else. A browser handed that on
# a TURN connection would reject it. Cloudflare cannot proxy TURN either: it is not HTTP, so
# the ICE URLs point straight at the origin address and never touch Cloudflare at all.
#
# To enable turns: you need a PUBLICLY TRUSTED certificate on a DNS-only (grey-cloud) name
# that resolves to this host — a Let's Encrypt cert for something like turn.rh1.tech. Then
# add back, and mount the certificate directory into the container:
#
#   tls-listening-port=5349
#   cert=/certs/fullchain.pem
#   pkey=/certs/privkey.pem
#   no-tlsv1
#   no-tlsv1_1
#
# And add a certbot deploy-hook that RESTARTS this container: coturn does not reliably reload
# certificates on SIGHUP, so TLS-TURN would die silently ninety days after launch.

# --- quotas ------------------------------------------------------------------
#
# A relay is bandwidth someone else is spending on our behalf. Cap it.
user-quota=12
total-quota=200
max-bps=64000

# --- THE SECURITY BLOCK. DO NOT REMOVE. --------------------------------------
#
# We hand a TURN credential to every authenticated user, and a TURN server's whole job is
# to relay traffic to wherever it is asked to. Without these lines any user with a login
# can ask this server to relay to mongo:27017, redis:6379, rabbitmq:5672, or the cloud
# metadata endpoint at 169.254.169.254 — a full SSRF into the private network, from the
# internet, authenticated. This is the single most important thing in this file.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# The admin telnet interface. There is no reason for it to exist here.
no-cli

# Uncomment on a host behind 1:1 NAT (EC2, GCP, most VPS with a floating IP). Without it
# coturn advertises the private address as its relay candidate and nothing can reach it.
# external-ip=PUBLIC_IP/PRIVATE_IP

# Quieter logs; the default is one line per allocation.
no-stdout-log
log-file=stdout
simple-log
