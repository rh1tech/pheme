# A self-hosted Pheme instance.
#
#   ./setup.sh                     # generates node.env, renders nginx, prints the join URL
#   docker compose --env-file node.env up -d
#
# Differs from deploy/prod/ in the ways a single operator differs from a
# maintained production stack: nothing assumes a host Postfix, an FCM key, a
# coturn, or a second hostname for the web app. Each of those is opt-in, and
# the instance is useful without any of them.
#
# Infra is internal to the compose network. The app and ingest bind to loopback
# so the host nginx can put TLS in front and mount them under the unlisted path
# prefix (see ../nginx/README.md).
name: pheme-self-host

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${API_IMAGE:-ghcr.io/rh1tech/pheme-api:latest}
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &service_env
      PHEME_STORE_DRIVER: mongo
      PHEME_BLOB_DRIVER: gridfs
      PHEME_BROKER_DRIVER: rabbit
      PHEME_LIVE_DRIVER: redis
      PHEME_RATELIMIT_DRIVER: redis
      PHEME_OTP_DRIVER: redis
      PHEME_MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      PHEME_MONGO_DB: pheme
      PHEME_RABBIT_URI: "amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/"
      PHEME_REDIS_ADDR: "redis:6379"
      PHEME_JWT_SECRET: ${PHEME_JWT_SECRET:?PHEME_JWT_SECRET must be set}
      PHEME_JWT_LEGACY_UNTIL: ${PHEME_JWT_LEGACY_UNTIL:-}
      # Host nginx overwrites X-Forwarded-For, so the API can key its auth
      # rate limits on the real client address instead of the proxy's.
      PHEME_TRUST_PROXY_HEADERS: ${PHEME_TRUST_PROXY_HEADERS:-true}
      PHEME_HOST_DOMAIN: ${PHEME_API_HOST}
      PHEME_HOST_KEY: ${PHEME_HOST_KEY:?PHEME_HOST_KEY must be set}
      PHEME_ADMIN_EMAILS: ${PHEME_ADMIN_EMAILS:-}
      # Registration is by invitation only unless this is explicitly turned off.
      # Admins mint invitation links from the panel (Admin -> Invites).
      PHEME_INVITE_ONLY: ${PHEME_INVITE_ONLY:-true}

      # MUST carry the path prefix. It is what the clients are handed, and what
      # the server builds absolute push-notification image URLs from. Without the
      # prefix every request lands on the decoy site, which presents as a total
      # outage rather than a misconfiguration.
      PHEME_PUBLIC_API_URL: ${PHEME_API_BASE}

      # Only set if you also serve the web app (see the `web` profile). An empty
      # list means no browser on another origin may call this API, which is the
      # right answer for a mobile-only instance.
      PHEME_CORS_ORIGINS: ${PHEME_WEB_ORIGIN:-}

      # Web Push works with nothing but these two keys, generated by setup.sh.
      # Mobile push needs a Firebase project of your own — see the README.
      PHEME_VAPID_PUBLIC: ${PHEME_VAPID_PUBLIC:?PHEME_VAPID_PUBLIC must be set}
      PHEME_VAPID_PRIVATE: ${PHEME_VAPID_PRIVATE:?PHEME_VAPID_PRIVATE must be set}
      PHEME_VAPID_SUBJECT: ${PHEME_API_BASE}
      PHEME_PUSH_DRIVER: ${PHEME_PUSH_DRIVER:-webpush}

      # Defaults to `log`, which prints verification codes to the container log
      # instead of emailing them. That is deliberate: a fresh instance works
      # immediately without an SMTP relay, and you read the first admin's code
      # out of `docker compose logs app`. Set the SMTP values to send for real.
      PHEME_MAIL_DRIVER: ${PHEME_MAIL_DRIVER:-log}
      PHEME_SMTP_HOST: ${PHEME_SMTP_HOST:-}
      PHEME_SMTP_PORT: ${PHEME_SMTP_PORT:-25}
      PHEME_SMTP_FROM: ${PHEME_SMTP_FROM:-}
      PHEME_SMTP_USER: ${PHEME_SMTP_USER:-}
      PHEME_SMTP_PASS: ${PHEME_SMTP_PASS:-}

      # 1:1 voice calls need a TURN relay for peers behind symmetric NAT. Empty
      # switches calling off rather than shipping a feature that fails silently
      # for some pairs and works for others.
      PHEME_TURN_URLS: ${PHEME_TURN_URLS:-}
      PHEME_TURN_SECRET: ${PHEME_TURN_SECRET:-}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8191}:8080"

  ingest:
    image: ${API_IMAGE:-ghcr.io/rh1tech/pheme-api:latest}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-ingest"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *service_env
    ports:
      - "127.0.0.1:${INGEST_HOST_PORT:-8192}:8081"

  dispatcher:
    image: ${API_IMAGE:-ghcr.io/rh1tech/pheme-api:latest}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/pheme-dispatcher"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *service_env

  # Opt-in: `docker compose --profile web up -d`.
  #
  # Serving the web app makes the host identifiable by its content no matter
  # what else is hidden, which is why it is not on by default. A mobile-only
  # instance is the stealthy configuration. See ../nginx/README.md.
  web:
    image: ${WEB_IMAGE:-ghcr.io/rh1tech/pheme-web:latest}
    restart: unless-stopped
    profiles: ["web"]
    environment:
      PHEME_API_BASE: ${PHEME_API_BASE}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8190}:80"

volumes:
  mongo-data:
  rabbit-data:
  redis-data:
