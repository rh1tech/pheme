# nginx config for the Pheme web container: serve the SPA and never cache the
# runtime config or index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the HTML entry must always be fresh.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # How a running tab learns a deploy has happened (lib/version). It must never be cached, or a
    # tab would poll a stale answer forever and never notice it is behind.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # The service worker must never be cached by the CDN/browser: a stale worker
    # pins old behaviour (e.g. notification handling). no-store stops Cloudflare
    # from edge-caching it, so every fetch gets the deployed version.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Web app manifest with the correct MIME type.
    # The service worker's imported scripts, and the crypto it loads.
    #
    # These fell through to the default four-hour cache, and that was the bug: sw.js is no-store
    # and updates immediately, but the preview.js it importScripts() came from the browser's HTTP
    # cache — so a NEW worker ran an OLD helper, and message previews silently failed for as long
    # as the cached copy lived. A worker's own script being fresh says nothing about its imports.
    #
    # no-store for the JavaScript, which is 50 KB and must always match the worker that imports it.
    location ~ ^/mls/.+\.js$ {
        add_header Cache-Control "no-store";
    }

    # The WASM is 1.2 MB and must NOT be refetched on every worker start, so it stays cacheable —
    # but bounded rather than immutable, and preview.js requests it with a version query it can
    # bump (see WASM_BINARY there). A week is short enough that a missed bump self-heals.
    location ~ ^/mls/.+\.wasm$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
