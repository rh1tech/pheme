<!-- Pheme's chat wallpaper: the app's own motifs — a message bubble, a bell, a paper plane,
     a star, an @, a bolt, an envelope, and the double tick the receipts introduced. Drawn for
     Pheme; not a copy of anyone else's artwork.

     Tiles seamlessly: a motif that runs off one edge is redrawn on the opposite one, so there
     is no seam at any offset. Scattered at varied rotation and scale on purpose — placed on a
     grid it reads as a spreadsheet rather than a wallpaper. -->
