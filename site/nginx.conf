# nginx for the pheme.rh1.tech marketing site.
#
# A static site, so this is short — but the two things it gets right are the two things a static
# site usually gets wrong: what may be cached, and what a wrong URL does.
#
# NOTE ON add_header: nginx does NOT merge add_header across levels. A location that sets any
# add_header of its own REPLACES the whole inherited set, so the security headers are repeated in
# every location that adds one. Without the repetition those locations silently serve with no CSP
# at all, which is the failure mode that looks like it works.

map $sent_http_content_type $site_cache {
    default                         "public, max-age=3600";
    # Fingerprint-free assets referenced with ?v=N. An hour is short enough that a mistake is
    # cheap and long enough that a repeat visit costs nothing.
    ~image/                         "public, max-age=604800, immutable";
    ~font/                          "public, max-age=604800, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No PHP, no uploads, no API. Everything below is one of a handful of static types.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Self-contained by construction: no external scripts, fonts or analytics, and the only
    # inline script is the one-liner that sets the `js` class. 'unsafe-inline' covers that and
    # the handful of inline styles; there is no user input on this site for it to be leveraged by.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cache-Control $site_cache always;

    # Clean URLs: /privacy/ serves /privacy/index.html, /privacy redirects to it. The redirect
    # matters for canonical consistency — two URLs serving one page splits its ranking and makes
    # the hreflang pairs disagree with what is actually served.
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML is the one thing that must not sit in a cache: a deploy changes it, and a visitor
    # holding yesterday's copy sees yesterday's privacy policy.
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # robots.txt and sitemap.xml are read by crawlers on their own schedule; a long cache here
    # only delays a correction.
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;
}
