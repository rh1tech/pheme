# One federated Pheme host for the cross-host E2E test. run.sh brings up two of
# these (hub + follower) under different compose projects on a shared network,
# each with its own Mongo/Redis/RabbitMQ. The app joins the shared fed network so
# the fedproxy container can route host-to-host S2S to it by container name; it
# also publishes a loopback port so the test can drive its client API.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pheme
      RABBITMQ_DEFAULT_PASS: pheme
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    image: ${IMAGE}
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      PHEME_STORE_DRIVER: mongo
      PHEME_BLOB_DRIVER: gridfs
      PHEME_BROKER_DRIVER: rabbit
      PHEME_LIVE_DRIVER: redis
      PHEME_RATELIMIT_DRIVER: redis
      PHEME_OTP_DRIVER: redis
      PHEME_PUSH_DRIVER: log
      PHEME_MAIL_DRIVER: log
      PHEME_MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      PHEME_MONGO_DB: pheme
      PHEME_RABBIT_URI: "amqp://pheme:pheme@rabbitmq:5672/"
      PHEME_REDIS_ADDR: "redis:6379"
      PHEME_JWT_SECRET: ${PHEME_JWT_SECRET}
      PHEME_HOST_DOMAIN: ${PHEME_HOST_DOMAIN}
      PHEME_HOST_KEY: ${PHEME_HOST_KEY}
      PHEME_NODELIST_COORD_KEY: ${PHEME_NODELIST_COORD_KEY}
      PHEME_NODELIST_PATH: /nodelist.json
      PHEME_PUBLIC_API_URL: ${PHEME_PUBLIC_API_URL}
      PHEME_SEED_ADMIN_EMAIL: ${PHEME_SEED_ADMIN_EMAIL}
      PHEME_SEED_ADMIN_PASSWORD: ${PHEME_SEED_ADMIN_PASSWORD}
      # Trust the fed test CA so host-to-host S2S over the self-signed cert verifies.
      SSL_CERT_FILE: /fed-ca.pem
    volumes:
      - "${FED_NODELIST}:/nodelist.json:ro"
      - "${FED_CA}:/fed-ca.pem:ro"
    networks:
      - default
      - fed
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:8080"

networks:
  fed:
    external: true
    name: ${FEDNET}
