name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# THE FAST LANE. Everything here finishes in about two minutes, because everything here is a
# check that a change can be judged by on its own: compilers, unit tests, conformance suites,
# analysers.
#
# The browser E2E suite lives in e2e.yml and does NOT run here. It took thirteen minutes of a
# fifteen-minute run, and the effect was not that releases were careful — it was that a one-line
# fix waited a quarter of an hour behind a browser driving a chat, and that the suite's flakes
# became the thing standing between a fix and production. Its last failure before this change was
# a flake that passed on re-run, unchanged.
#
# What replaces it on the release path is a smoke test that runs AFTER the deploy, against the
# real thing (see deploy.yml). That answers a question the E2E cannot: whether what is now serving
# production actually works.
#
# Run the full suite whenever a change deserves it — the Actions tab, "E2E", "Run workflow" — and
# it runs nightly regardless, so it cannot quietly rot.

# Only one CI run per branch at a time. A newer push supersedes an older one anyway, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests always use disposable GitHub-hosted runners: contributor code must never reach
# the persistent host that also runs production services. Trusted pushes to protected main keep
# using the `ci` runner label so tests do not queue behind releases.

jobs:
  attribution:
    name: Attribution
    # Cheap and first: a commit crediting an AI must never reach main, and finding out at merge
    # time is finding out too late. GitHub's own "restrict commit metadata" ruleset would block
    # this at push time, but that rule is Enterprise-only — so this is the enforcement that is
    # actually available, and it is why it gates the merge rather than merely reporting.
    #
    # A local hook cannot do this job: it protects whoever installed it, and the commit that
    # prompted all this was authored through GitHub's own web surface, where no local hook runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history on a PR so every commit in the branch is inspected, not just the tip.
          fetch-depth: 0
      - name: Reject AI attribution in commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # An empty or all-zero BASE means there is no predecessor to diff against (first push
          # to a branch, or a forced update). Fall back to the tip commit alone rather than
          # scanning 400 commits of history that were already accepted.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            range="${HEAD_SHA} -1"
          else
            range="${BASE}..${HEAD_SHA}"
          fi
          echo "Inspecting: ${range}"
          # shellcheck disable=SC2086
          offenders=$(git log --format='%H%x09%an <%ae>%x09%s%n%b' ${range} \
            | grep -inE 'co-authored-by:.*(copilot|claude|chatgpt|gpt-|anthropic|openai|codex|cursor|devin|gemini|bard)|generated with \[?(claude|copilot|chatgpt)|assisted-by:|claude-session' || true)
          if [ -n "${offenders}" ]; then
            echo "::error::Commit messages credit an AI. Remove the trailer and amend/rebase."
            echo "${offenders}"
            exit 1
          fi
          # Authorship, not just trailers: a commit written BY a bot account counts too.
          bots=$(git log --format='%H %an <%ae>' ${range} \
            | grep -iE 'copilot|claude|chatgpt|anthropic|openai\[bot\]' || true)
          if [ -n "${bots}" ]; then
            echo "::error::Commits authored by an AI account."
            echo "${bots}"
            exit 1
          fi
          echo "No AI attribution found."

  api:
    name: API (Go)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","ci"]') }}
    env:
      MONGO_CONTAINER: pheme-ci-mongo-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: pheme-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      RABBIT_CONTAINER: pheme-ci-rabbit-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # NO `cache:`. Trusted main pushes run on a self-hosted runner whose disk persists,
      # so the module cache (~/go/pkg/mod) and build cache (~/.cache/go-build) are already
      # sitting on that box — 820 MB and 8 GB of them.
      # GitHub's cache was uploading half a gigabyte of that over the internet and
      # downloading it back on every run, to populate directories that were never empty.
      #
      # It was not free: the caches in this file had grown to 5.75 GB of the repo's
      # 10 GB limit, which evicts by least-recently-used — so the entries that were
      # genuinely doing nothing were also crowding out the ones that were.
      #
      # deploy.yml reached the same conclusion about Docker layers; this is that fix,
      # applied to the toolchains.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: api/go.mod
          cache: false
      # The store has two hand-written implementations of one interface, and production runs the
      # Mongo one while almost every test exercised the in-memory one. They have already disagreed:
      # the profile update that blanked people's display names was Mongo-only behaviour. The
      # conformance suite runs one set of assertions against BOTH, and it can only do that with a
      # real database — without this it skips the half that ships.
      #
      # Started by hand rather than with `services:`, which needs a container network this
      # self-hosted runner does not have ("Value cannot be null. (Parameter 'network')").
      #
      # The container name carries the run and job id: two jobs share this host, and a fixed name
      # would have one job's cleanup kill the other's database mid-test.
      - name: Start MongoDB for the store conformance suite
        run: |
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          # The cache is capped because this host also runs prod and dev: mongod sizes its
          # WiredTiger cache from TOTAL system memory, not from what it is allowed to use, and an
          # unbounded one competes with the services that matter.
          # NO --rm. A container that removes itself on exit takes its log with it, and the last
          # two rounds of this failed with "no such object" where the log should have been —
          # instrumentation that disappears exactly when it is needed. The cleanup step below
          # removes it explicitly instead.
          #
          # An EPHEMERAL host port, discovered after the fact.
          #
          # A fixed port was the bug. The container NAME was scoped per run but the port was not, so
          # two overlapping runs raced for it: the second container could not bind, exited, and --rm
          # swept it away — while the second run's tests connected happily to the FIRST run's
          # database, passed for a while, and then died mid-suite when that run cleaned up. It read
          # as mongod crashing ("socket was unexpectedly closed"), which is why it took three
          # attempts to find; the diagnostics added last round are what showed the container was
          # simply gone, with no OOM and 22 GB free.
          #
          # --ulimit nofile is not optional. The conformance suites open a database per subtest and
          # each one builds its indexes, so a run holds thousands of WiredTiger files. Against the
          # host's default descriptor limit mongod hit EMFILE mid-suite ("WiredTiger error 24"),
          # tripped fassert 50853 and aborted with SIGABRT — which reads from the client side as
          # "socket was unexpectedly closed" and then thirty-second timeouts on everything after.
          # 64000 is MongoDB's own documented requirement.
          docker run -d --name "$MONGO_CONTAINER" -p 127.0.0.1::27017 \
            --ulimit nofile=64000:64000 \
            mongo:7 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              port=$(docker port "$MONGO_CONTAINER" 27017/tcp | head -1 | sed 's/.*://')
              echo "mongo ready on $port"
              echo "PHEME_TEST_MONGO_URI=mongodb://127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "mongo never became ready"; docker logs "$MONGO_CONTAINER" | tail -20; exit 1
      # Same reasoning for the OTP store, which guards signup and password reset: production runs
      # the Redis one and the tests exercised the in-memory one.
      - name: Start Redis for the OTP conformance suite
        run: |
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true
          docker run -d --name "$REDIS_CONTAINER" -p 127.0.0.1::6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping >/dev/null 2>&1; then
              port=$(docker port "$REDIS_CONTAINER" 6379/tcp | head -1 | sed 's/.*://')
              echo "redis ready on $port"
              echo "PHEME_TEST_REDIS_ADDR=127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "redis never became ready"; docker logs "$REDIS_CONTAINER" | tail -20; exit 1
      # The broker that ships. The in-memory driver is a Go channel and cannot express what matters
      # here: a publish CONFIRMED by the broker, and a failed handler dead-lettering rather than
      # spinning on the same message forever.
      - name: Start RabbitMQ for the broker tests
        run: |
          docker rm -f "$RABBIT_CONTAINER" 2>/dev/null || true
          docker run -d --name "$RABBIT_CONTAINER" -p 127.0.0.1::5672 rabbitmq:3-alpine
          port=$(docker port "$RABBIT_CONTAINER" 5672/tcp | head -1 | sed 's/.*://')
          # Wait on the container's LOG, never by exec'ing rabbitmq-diagnostics into the container
          # and never on the port alone. Both alternatives were tried and both were wrong:
          #
          # docker exec runs as root, and every Erlang CLI tool reads — and CREATES, mode 400,
          # owned by whoever ran it — $HOME/.erlang.cookie, which in this image is
          # /var/lib/rabbitmq/.erlang.cookie. Poll before the server has written its own and root
          # wins the race, leaving the broker (running as rabbitmq) unable to read its own cookie:
          # "eacces", and it never boots. The readiness check killed the thing it was checking.
          #
          # The port opens DURING boot, roughly 150ms before the broker can serve anything, so a
          # TCP connect succeeds and the AMQP handshake is then reset by peer.
          #
          # "Server startup complete" is emitted when it is genuinely ready, and reading logs
          # touches nothing inside the container.
          for i in $(seq 1 45); do
            if docker logs "$RABBIT_CONTAINER" 2>&1 | grep -q "Server startup complete"; then
              echo "rabbit ready on $port"
              echo "PHEME_TEST_RABBIT_URI=amqp://guest:guest@127.0.0.1:$port/" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 4
          done
          echo "rabbit never became ready"; docker logs "$RABBIT_CONTAINER" | tail -30; exit 1
      - run: go vet ./...
      - run: go build ./...
      # PHEME_TEST_MONGO_URI and PHEME_TEST_REDIS_ADDR come from the startup steps above, which
      # discover the ephemeral ports Docker chose.
      - run: go test -race -cover ./...
      # If the tests failed, say what the databases were doing. mongod dying mid-run reads as a
      # test failure — thirty-second selection timeouts on everything after it — and without its
      # own log the cause is guesswork. This is failure()-only so a green run stays quiet.
      - name: Database logs on failure
        if: failure()
        run: |
          # The FATAL line first. A mongod crash dumps forty-odd stack frames after it, so a plain
          # tail shows only the frames and never the reason — which is how two rounds of this got
          # spent guessing.
          echo "=== mongo: why it stopped ==="
          docker logs "$MONGO_CONTAINER" 2>&1 \
            | grep -iE 'fassert|invariant|abort|terminate|Fatal|out of memory|ENOSPC|WiredTiger error|shutting down|got signal|BadValue|exception' \
            | tail -25 || true
          echo "=== mongo: last 120 lines ==="; docker logs "$MONGO_CONTAINER" 2>&1 | tail -120 || true
          echo "=== mongo state ==="; docker inspect "$MONGO_CONTAINER" --format '{{.State.Status}} oomkilled={{.State.OOMKilled}} exit={{.State.ExitCode}}' || true
          echo "=== redis ==="; docker logs "$REDIS_CONTAINER" 2>&1 | tail -20 || true
          echo "=== rabbit ==="; docker logs "$RABBIT_CONTAINER" 2>&1 | tail -30 || true
          echo "=== host memory ==="; free -m || true
      # always(), so a failing test still takes its containers with it rather than leaving them
      # running on a shared host until somebody notices.
      - name: Stop the test databases and broker
        if: always()
        run: |
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true
          docker rm -f "$RABBIT_CONTAINER" 2>/dev/null || true

  web:
    name: Web (Vite)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","ci"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `cache: npm` — see the API job. On trusted main pushes npm's own cache
      # (~/.npm) persists on the runner, which is what `npm ci` installs from.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Includes the call-signal golden vector, which is the same vector the Flutter
      # client asserts. If the two ever disagree by a byte, calls between a phone and a
      # browser stop connecting with nothing in any log to say why.
      - run: npm test

  crypto:
    name: Crypto (Rust)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","ci"]') }}
    # Build artefacts go OUTSIDE the workspace, because checkout cleans the workspace
    # and would take them with it. ~/.cargo (the registry) already survives on its own;
    # this is the part that did not, and it is why the run was recompiling the whole
    # dependency graph twice — once per manifest — every time.
    #
    # Both manifests share one directory deliberately: they share most of their
    # dependencies, so the second cargo invocation gets them already built.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # Set here rather than in `env:`, which takes its values literally — `$HOME`
      # there would reach cargo as the four characters, not as a path.
      #
      # A persistent cache is a cache that grows, and a cargo target directory grows
      # without bound: old dependency versions are never reclaimed. Nothing in it is
      # precious, so past a ceiling the cheapest correct thing is to start again.
      - name: Point cargo at a persistent build directory
        run: |
          target="$HOME/.cache/pheme-cargo-target"
          mkdir -p "$target"
          size=$(du -sm "$target" | cut -f1)
          echo "cargo target dir: $target (${size} MB)"
          if [ "$size" -gt 10240 ]; then
            echo "over 10 GB, clearing"
            rm -rf "${target:?}"/*
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
      # The MLS core, shared by the web (via WASM) and the phone (via FFI). It has tests
      # and nothing was running them.
      - run: cargo test --manifest-path crates/pheme-mls/Cargo.toml
      # The Dart FFI facade over it, whose tests pin the invariants that fail silently:
      # a device's state captured after minting its key package, decrypt-exactly-once,
      # and a sender never being able to read its own message.
      - run: cargo test --manifest-path mobile/rust/Cargo.toml

      # The web's WASM bundle is built from the same crate and VENDORED into
      # web/src/crypto/pkg/, so nothing in the web build would notice if a change to the
      # crate broke the wasm target — it would keep using the committed bundle, and the
      # break would surface the next time somebody ran wasm-pack, long after the change.
      #
      # This checks the target still compiles. It deliberately does NOT rebuild the bundle
      # and diff it against the committed one: wasm-pack's output is not byte-reproducible
      # across toolchain versions, so that job would fail for reasons that have nothing to
      # do with the code, and a check that cries wolf is a check people learn to ignore.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --manifest-path crates/pheme-mls/Cargo.toml --target wasm32-unknown-unknown

  mobile:
    name: Mobile (Flutter)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","ci"]') }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `cache: false`, and it costs nothing on the persistent main-branch runner. The action downloads the SDK only when
      # $RUNNER_TOOL_CACHE/flutter/<channel>-<version>-<arch>/flutter/bin/flutter is
      # missing — that check does not consult the `cache` input at all — and the SDK is
      # already unpacked there on both runners.
      #
      # This was the single worst offender: the same 1.6 GB SDK was held THREE times in
      # GitHub's cache, 4.8 GB of the repo's 5.75 GB. Cache entries are scoped per branch,
      # so every PR branch that ran this job stored its own copy of an identical SDK.
      # ~/.pub-cache persists locally for the package cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: false
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      # Includes the call-signal golden vector generated from the web client. It is pure
      # Dart precisely so it runs here, with no NDK and no native library — a test that
      # needs a compiled Rust lib would not run on this box, which means in practice it
      # would not run at all.
      #
      # Everything except `golden`: the IMAGE goldens (test/golden) are rasterised by the
      # host, and a blur laid down by macOS's Skia is not the same bytes as one laid down
      # here, so they would fail on this runner for a reason that has nothing to do with
      # the change under test. They are a local design check — see mobile/dart_test.yaml.
      - run: flutter test -x golden
