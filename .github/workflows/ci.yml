name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only one CI run per branch at a time. The two runners share a host, so two runs in parallel put
# two of the SAME-numbered E2E shard on that host at once — and per-shard ports (PW_PORT_OFFSET)
# separate shards WITHIN a run, not across runs, so both would bind the same port and one would die
# with "address already in use". A newer push supersedes an older one anyway, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The `ci` label keeps test jobs off the runner reserved for releases. Without it a deploy waits
# behind whatever the test suite happens to be doing, which is how a four-minute release became a
# twenty-minute one — the work was never the slow part, the queue was.

jobs:
  api:
    name: API (Go)
    runs-on: [self-hosted, linux, ci]
    env:
      MONGO_CONTAINER: pheme-ci-mongo-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_CONTAINER: pheme-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # The store has two hand-written implementations of one interface, and production runs the
      # Mongo one while almost every test exercised the in-memory one. They have already disagreed:
      # the profile update that blanked people's display names was Mongo-only behaviour. The
      # conformance suite runs one set of assertions against BOTH, and it can only do that with a
      # real database — without this it skips the half that ships.
      #
      # Started by hand rather than with `services:`, which needs a container network this
      # self-hosted runner does not have ("Value cannot be null. (Parameter 'network')").
      #
      # The container name carries the run and job id: two jobs share this host, and a fixed name
      # would have one job's cleanup kill the other's database mid-test.
      - name: Start MongoDB for the store conformance suite
        run: |
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          # The cache is capped because this host also runs prod and dev: mongod sizes its
          # WiredTiger cache from TOTAL system memory, not from what it is allowed to use, and an
          # unbounded one competes with the services that matter.
          # NO --rm. A container that removes itself on exit takes its log with it, and the last
          # two rounds of this failed with "no such object" where the log should have been —
          # instrumentation that disappears exactly when it is needed. The cleanup step below
          # removes it explicitly instead.
          #
          # An EPHEMERAL host port, discovered after the fact.
          #
          # A fixed port was the bug. The container NAME was scoped per run but the port was not, so
          # two overlapping runs raced for it: the second container could not bind, exited, and --rm
          # swept it away — while the second run's tests connected happily to the FIRST run's
          # database, passed for a while, and then died mid-suite when that run cleaned up. It read
          # as mongod crashing ("socket was unexpectedly closed"), which is why it took three
          # attempts to find; the diagnostics added last round are what showed the container was
          # simply gone, with no OOM and 22 GB free.
          docker run -d --name "$MONGO_CONTAINER" -p 127.0.0.1::27017 \
            mongo:7 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              port=$(docker port "$MONGO_CONTAINER" 27017/tcp | head -1 | sed 's/.*://')
              echo "mongo ready on $port"
              echo "PHEME_TEST_MONGO_URI=mongodb://127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "mongo never became ready"; docker logs "$MONGO_CONTAINER" | tail -20; exit 1
      # Same reasoning for the OTP store, which guards signup and password reset: production runs
      # the Redis one and the tests exercised the in-memory one.
      - name: Start Redis for the OTP conformance suite
        run: |
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true
          docker run -d --name "$REDIS_CONTAINER" -p 127.0.0.1::6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping >/dev/null 2>&1; then
              port=$(docker port "$REDIS_CONTAINER" 6379/tcp | head -1 | sed 's/.*://')
              echo "redis ready on $port"
              echo "PHEME_TEST_REDIS_ADDR=127.0.0.1:$port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "redis never became ready"; docker logs "$REDIS_CONTAINER" | tail -20; exit 1
      - run: go vet ./...
      - run: go build ./...
      # PHEME_TEST_MONGO_URI and PHEME_TEST_REDIS_ADDR come from the startup steps above, which
      # discover the ephemeral ports Docker chose.
      - run: go test -race -cover ./...
      # If the tests failed, say what the databases were doing. mongod dying mid-run reads as a
      # test failure — thirty-second selection timeouts on everything after it — and without its
      # own log the cause is guesswork. This is failure()-only so a green run stays quiet.
      - name: Database logs on failure
        if: failure()
        run: |
          echo "=== mongo ==="; docker logs "$MONGO_CONTAINER" 2>&1 | tail -40 || true
          echo "=== mongo state ==="; docker inspect "$MONGO_CONTAINER" --format '{{.State.Status}} oomkilled={{.State.OOMKilled}} exit={{.State.ExitCode}}' || true
          echo "=== redis ==="; docker logs "$REDIS_CONTAINER" 2>&1 | tail -20 || true
          echo "=== host memory ==="; free -m || true
      # always(), so a failing test still takes its containers with it rather than leaving them
      # running on a shared host until somebody notices.
      - name: Stop MongoDB and Redis
        if: always()
        run: |
          docker rm -f "$MONGO_CONTAINER" 2>/dev/null || true
          docker rm -f "$REDIS_CONTAINER" 2>/dev/null || true

  web:
    name: Web (Vite)
    runs-on: [self-hosted, linux, ci]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Includes the call-signal golden vector, which is the same vector the Flutter
      # client asserts. If the two ever disagree by a byte, calls between a phone and a
      # browser stop connecting with nothing in any log to say why.
      - run: npm test

  crypto:
    name: Crypto (Rust)
    runs-on: [self-hosted, linux, ci]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The MLS core, shared by the web (via WASM) and the phone (via FFI). It has tests
      # and nothing was running them.
      - run: cargo test --manifest-path crates/pheme-mls/Cargo.toml
      # The Dart FFI facade over it, whose tests pin the invariants that fail silently:
      # a device's state captured after minting its key package, decrypt-exactly-once,
      # and a sender never being able to read its own message.
      - run: cargo test --manifest-path mobile/rust/Cargo.toml

      # The web's WASM bundle is built from the same crate and VENDORED into
      # web/src/crypto/pkg/, so nothing in the web build would notice if a change to the
      # crate broke the wasm target — it would keep using the committed bundle, and the
      # break would surface the next time somebody ran wasm-pack, long after the change.
      #
      # This checks the target still compiles. It deliberately does NOT rebuild the bundle
      # and diff it against the committed one: wasm-pack's output is not byte-reproducible
      # across toolchain versions, so that job would fail for reasons that have nothing to
      # do with the code, and a check that cries wolf is a check people learn to ignore.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --manifest-path crates/pheme-mls/Cargo.toml --target wasm32-unknown-unknown

  mobile:
    name: Mobile (Flutter)
    runs-on: [self-hosted, linux, ci]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      # Includes the call-signal golden vector generated from the web client. It is pure
      # Dart precisely so it runs here, with no NDK and no native library — a test that
      # needs a compiled Rust lib would not run on this box, which means in practice it
      # would not run at all.
      - run: flutter test

  e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, linux, ci]
    # Sharded across the self-hosted runners. Each shard runs its OWN App API
    # (go run, in-memory drivers) via the Playwright webServer, so the in-memory
    # server's state — every device's sealed backup and history-sync blob — only
    # accumulates over HALF the suite. The whole-suite volume was slowing late
    # logins past their timeout on a single server; splitting it keeps each
    # server's working set small enough that logins stay fast to the last test.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # The Playwright config starts the Vite dev server and the App API (in-memory
      # drivers, seeded admin), then tears them down. Two shards, one per runner, split
      # the suite so no dev server carries the whole of it. CI=true disables server reuse
      # so each shard is isolated.
      #
      # PW_PORT_OFFSET gives each shard its OWN ports (see e2e/constants.ts): the two
      # runners share a host, so without it the shards' App APIs collide on one port.
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          PW_PORT_OFFSET: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7
