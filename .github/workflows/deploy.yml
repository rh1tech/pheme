name: Deploy

# Push tag vX.Y.Z -> build images once, deploy PROD to BOTH federated hosts. That
# is the only trigger. The first host (deploy/smoke) uses DEPLOY_* / PROD_API_URL;
# the second (deploy-2/smoke-2) uses the …_2 variants, so the two boxes are
# configured independently but always run the identical release.
#
# Pushing main used to deploy a DEV environment, and a tagged release pushes main AND the tag
# together — so every release ran this workflow TWICE, and the concurrency group below made the
# PROD run wait for the whole DEV run to finish first. About fifteen minutes of a twenty-minute
# release was spent deploying an environment nobody uses.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# One deploy at a time. Two tags pushed close together would otherwise share the one box's Docker
# daemon and credential store, and concurrent `docker login ghcr.io` clobber each other — the push
# then comes back "denied". Queued, never cancelled: every tag that was pushed gets deployed.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/pheme-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/pheme-web

jobs:
  build:
    name: Build & push images
    runs-on: [self-hosted, linux, deploy]
    # A private credential store for this job, so a login here can never collide with
    # another workflow's on the same box. Belt to the concurrency group's braces.
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-${{ github.run_id }}
    outputs:
      api_image: ${{ steps.refs.outputs.api_image }}
      web_image: ${{ steps.refs.outputs.web_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tag
        id: refs
        run: |
          TAG="${GITHUB_REF_NAME}"
          API="${REGISTRY,,}/${API_IMAGE_NAME,,}"
          WEB="${REGISTRY,,}/${WEB_IMAGE_NAME,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "api_image=${API}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "web_image=${WEB}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "api_repo=${API}" >> "$GITHUB_OUTPUT"
          echo "web_repo=${WEB}" >> "$GITHUB_OUTPUT"

      # The HOST daemon's builder, deliberately, rather than a fresh container per run.
      #
      # Everything that makes a rebuild quick lives in the builder's own state: the layer cache
      # and — the part that actually matters — the BuildKit cache mounts holding Go's compiler
      # output and module cache (see api/Dockerfile). A throwaway builder discards all of it on
      # every run, which is exactly how a release came to spend 160 seconds recompiling
      # dependencies that had not changed.
      #
      # This is a dedicated box that only ever builds this project, so the daemon is the right
      # place for that state to live. It also means no cache import/export at all: the previous
      # arrangement shipped every layer to GitHub's cache service and back over the internet on
      # each build, which on a self-hosted runner is pure overhead.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker

      # GHCR_TOKEN when present, GITHUB_TOKEN otherwise.
      #
      # A user-owned package grants a repository's GITHUB_TOKEN write access only if that
      # repository is on the package's "Manage Actions access" list. Recreating this repository
      # orphaned the pheme-api and pheme-web packages from it, and the picker that would re-add
      # them does not offer the new repository — so pushes fail with permission_denied even
      # though the job holds packages: write. A personal token owned by the package owner has
      # that access directly and does not depend on the link.
      #
      # The fallback keeps this working unchanged wherever GHCR_TOKEN is not set.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.refs.outputs.api_image }}
            ${{ steps.refs.outputs.api_repo }}:latest
          # Links the package back to this repository. GHCR reads this label to decide which
          # repository a container belongs to, which is what grants the repo's GITHUB_TOKEN write
          # access to it — the link that recreating this repository broke.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

      - name: Build & push Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PHEME_VERSION=${{ steps.refs.outputs.tag }}
          tags: |
            ${{ steps.refs.outputs.web_image }}
            ${{ steps.refs.outputs.web_repo }}:latest
          # Links the package back to this repository. GHCR reads this label to decide which
          # repository a container belongs to, which is what grants the repo's GITHUB_TOKEN write
          # access to it — the link that recreating this repository broke.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false

      # A persistent cache is a cache that grows. Anything untouched for a fortnight is not
      # helping a build any more; `if: always()` so a failed build still tidies up after itself.
      - name: Bound the build cache
        if: always()
        run: docker builder prune --force --filter until=336h

  deploy:
    name: Deploy prod
    needs: build
    runs-on: [self-hosted, linux, deploy]
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id_deploy deploy/prod/docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/pheme/docker-compose.yml"
          # coturn's config. The compose file mounts it relative to /opt/pheme, so it has to
          # be here or the container starts with coturn's defaults — which is an open relay.
          scp -i ~/.ssh/id_deploy deploy/prod/turnserver.conf \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/pheme/turnserver.conf"
          scp -i ~/.ssh/id_deploy deploy/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/pheme/deploy.sh"
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x /opt/pheme/deploy.sh"

      - name: Log server in to GHCR
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          # Passed via env to avoid shell-injection: a github.actor value containing
          # shell metacharacters (backticks, $()) would execute if interpolated inline.
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "${GHCR_TOKEN}" | ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io -u \"${GHCR_USER}\" --password-stdin"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENV_NAME: prod
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "API_IMAGE='${API_IMAGE}' WEB_IMAGE='${WEB_IMAGE}' /opt/pheme/deploy.sh '${ENV_NAME}'"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  smoke:
    name: Smoke test prod
    needs: [build, deploy]
    runs-on: [self-hosted, linux, deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # What a release is actually checked by now.
      #
      # It is a smaller question than the browser suite asks, and it asks it of something the
      # browser suite cannot reach: the containers now serving users. A green deploy only means
      # the workflow's steps exited zero — it does not mean the new image is running, that the
      # API can reach its database, or that the web app was rebuilt. Every one of those has been
      # verified by hand after a deploy at some point; none of them was automated.
      #
      # Read-only on purpose. Smoke tests that create accounts or post messages leave litter in
      # production forever, and litter that looks like real user data is worse than no test.
      - name: Smoke
        env:
          WEB_URL: ${{ vars.PROD_WEB_URL }}
          # Must include the unlisted path prefix the API is mounted under, exactly
          # as PHEME_API_BASE in stack.env does — without it every request below
          # lands on the decoy site and the smoke test measures nothing. Held as a
          # secret rather than a var so it stays out of the workflow logs.
          API_URL: ${{ secrets.PROD_API_URL }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAILED: $*" >&2; exit 1; }

          # An unset PROD_API_URL would make every check below hit the decoy site,
          # and a decoy that 404s cleanly would look exactly like a broken deploy.
          # Say which it is.
          [ -n "$API_URL" ] || fail "PROD_API_URL secret is not set (it must include the path prefix)"

          # Containers are restarting as this begins, so give them a moment to come up rather
          # than reporting the restart as a broken deploy.
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$API_URL/healthz" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            [ "$i" = "30" ] && fail "API never became healthy: last status $code"
            sleep 2
          done
          echo "  api healthy"

          # THE check. A deploy can go green while the old image keeps serving — the workflow
          # reports on its own steps, not on what the box ended up running. This is the only step
          # here that would have caught that, and it is the failure most likely to go unnoticed
          # because everything else still works: it just works with yesterday's code.
          served=$(curl -fsS "$WEB_URL/version.json" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          [ -n "$served" ] || fail "no version served at $WEB_URL/version.json"
          [ "$served" = "$EXPECTED_VERSION" ] \
            || fail "prod is serving $served, but this deploy was $EXPECTED_VERSION"
          echo "  serving $served"

          # The web app answers at all.
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$WEB_URL/")
          [ "$code" = "200" ] || fail "web root returned $code"
          echo "  web root 200"

          # Authentication reaches the database and rejects properly. Wrong credentials must be
          # 401: a 500 here means the store is unreachable and every login on the service is
          # failing, which the health endpoint alone does not notice. No account is created and
          # nothing is written.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-check@invalid.pheme.test","password":"not-a-real-password"}')
          [ "$code" = "401" ] || fail "login with bad credentials returned $code, expected 401"
          echo "  auth path alive (401 on bad credentials)"

          # The API must be invisible without the prefix. This is the one property
          # the decoy exists to provide, and it is the one most likely to be lost
          # quietly -- an unprefixed location left in a vhost, a proxy_pass edited
          # during an unrelated fix. Nothing else here would notice, because the
          # app itself would keep working perfectly.
          #
          # Derives the bare origin from API_URL by stripping the prefix path.
          origin=$(printf '%s' "$API_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          for probe in /healthz /v1/meta /v1/stream; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$origin$probe")
            [ "$code" = "404" ] \
              || fail "$probe answered $code without the path prefix, expected 404 from the decoy"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$origin/v1/auth/login" \
            -H 'Content-Type: application/json' -d '{"email":"x@invalid.pheme.test","password":"x"}')
          [ "$code" = "404" ] \
            || fail "unprefixed login answered $code, expected 404 — the API is reachable without the prefix"
          echo "  api invisible without the prefix"

          echo "SMOKE PASSED"

  # --- Second host -------------------------------------------------------------
  #
  # The same release, deployed to the second federated server in parallel with the
  # first. It uses its own set of secrets (…_2) so the two boxes are configured
  # independently; both pull the identical images the build job pushed. Kept as a
  # separate job rather than a matrix so the proven first-host path is untouched.
  deploy-2:
    name: Deploy prod (host 2)
    needs: build
    # Runs ON the second host (its own runner), deploying to localhost. The first
    # host's deploy runner cannot SSH out to this box (egress to :22 is blocked), and
    # a local deploy needs no SSH, no key, and no inbound access at all.
    runs-on: [self-hosted, linux, deploy-local]
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync deploy files
        run: |
          cp deploy/prod/docker-compose.yml /opt/pheme/docker-compose.yml
          cp deploy/prod/turnserver.conf   /opt/pheme/turnserver.conf
          cp deploy/deploy.sh              /opt/pheme/deploy.sh
          chmod +x /opt/pheme/deploy.sh

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Deploy
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
        run: |
          API_IMAGE="$API_IMAGE" WEB_IMAGE="$WEB_IMAGE" /opt/pheme/deploy.sh prod

  smoke-2:
    name: Smoke test prod (host 2)
    needs: [build, deploy-2]
    runs-on: [self-hosted, linux, deploy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Smoke
        env:
          WEB_URL: ${{ vars.PROD_WEB_URL_2 }}
          API_URL: ${{ secrets.PROD_API_URL_2 }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAILED: $*" >&2; exit 1; }
          [ -n "$API_URL" ] || fail "PROD_API_URL_2 secret is not set (it must include the path prefix)"
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$API_URL/healthz" 2>/dev/null || echo 000)
            [ "$code" = "200" ] && break
            [ "$i" = "30" ] && fail "API never became healthy: last status $code"
            sleep 2
          done
          echo "  api healthy"
          served=$(curl -fsS "$WEB_URL/version.json" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
          [ -n "$served" ] || fail "no version served at $WEB_URL/version.json"
          [ "$served" = "$EXPECTED_VERSION" ] || fail "prod is serving $served, but this deploy was $EXPECTED_VERSION"
          echo "  serving $served"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$WEB_URL/")
          [ "$code" = "200" ] || fail "web root returned $code"
          echo "  web root 200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke-check@invalid.pheme.test","password":"not-a-real-password"}')
          [ "$code" = "401" ] || fail "login with bad credentials returned $code, expected 401"
          echo "  auth path alive (401 on bad credentials)"
          origin=$(printf '%s' "$API_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          for probe in /healthz /v1/meta /v1/stream; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$origin$probe")
            [ "$code" = "404" ] || fail "$probe answered $code without the path prefix, expected 404 from the decoy"
          done
          echo "  api invisible without the prefix"
          echo "SMOKE PASSED"
