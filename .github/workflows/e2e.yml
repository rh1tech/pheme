name: E2E

# The full browser suite, on demand and nightly — deliberately NOT on every push.
#
# It used to run in CI on every commit, where it was thirteen minutes of a fifteen-minute run. The
# cost was not thoroughness, it was latency on the release path: a one-line fix waited a quarter of
# an hour behind a browser driving a chat, and the suite's own flakes became the thing standing
# between a fix and production. The last failure before this split was exactly that — the chat-e2ee
# membership spec, which passed on re-run with no change at all.
#
# So it moved to where its cost is affordable. Run it from the Actions tab when a change deserves
# it — anything touching MLS, group membership, calls, or the service worker — and it runs nightly
# regardless, so nobody has to remember and it cannot quietly rot into permanent red.
#
# What guards the ordinary release instead is the smoke test in deploy.yml, which runs after the
# deploy against production itself. It answers a narrower question than this suite, but it answers
# it about the thing that is actually serving users.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run specs matching this (Playwright --grep). Empty runs everything.'
        required: false
        type: string
      project:
        description: 'Browser project'
        required: false
        default: all
        type: choice
        options: [all, chromium, mobile-safari]
  schedule:
    # 03:00 UTC. Nothing else is using the runners, and a failure is waiting by morning.
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, linux, ci]
    # Sharded across the self-hosted runners. Each shard runs its OWN App API
    # (go run, in-memory drivers) via the Playwright webServer, so the in-memory
    # server's state — every device's sealed backup and history-sync blob — only
    # accumulates over HALF the suite. The whole-suite volume was slowing late
    # logins past their timeout on a single server; splitting it keeps each
    # server's working set small enough that logins stay fast to the last test.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `cache:` on either — same reasoning as ci.yml. These are self-hosted runners
      # whose ~/go, ~/.cache/go-build and ~/.npm are already on the disk this job runs on,
      # so GitHub's cache round-trips them over the internet for nothing and counts
      # against a limit that has real work queued behind it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: api/go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      # The Playwright config starts the Vite dev server and the App API (in-memory
      # drivers, seeded admin), then tears them down. Two shards, one per runner, split
      # the suite so no dev server carries the whole of it. CI=true disables server reuse
      # so each shard is isolated.
      #
      # PW_PORT_OFFSET gives each shard its OWN ports (see e2e/constants.ts): the two
      # runners share a host, so without it the shards' App APIs collide on one port.
      - name: Run the suite
        run: |
          args=("--shard=${{ matrix.shard }}/2")
          if [ -n "$INPUT_GREP" ]; then
            args+=(--grep "$INPUT_GREP")
          fi
          if [ "$INPUT_PROJECT" != "all" ] && [ -n "$INPUT_PROJECT" ]; then
            args+=(--project "$INPUT_PROJECT")
          fi
          printf 'npx playwright test'
          printf ' %q' "${args[@]}"
          printf '\n'
          npx playwright test "${args[@]}"
        env:
          INPUT_GREP: ${{ inputs.grep }}
          INPUT_PROJECT: ${{ inputs.project }}
          PW_PORT_OFFSET: ${{ matrix.shard }}

      # The report stays on the runner rather than going to GitHub.
      #
      # These are self-hosted runners, so an upload sends the report out to GitHub's
      # artifact store and counts against the account's storage — for a file that was
      # already on the disk of the box that produced it. Kept here instead, under a
      # path a person can read directly.
      #
      # Only on failure. A passing run's report tells nobody anything, and the whole
      # point of not uploading is to stop accumulating reports nobody opens.
      - name: Keep the report
        if: failure()
        run: |
          dest="/opt/pheme-ci/playwright-reports/${{ github.run_id }}-shard${{ matrix.shard }}"
          mkdir -p "$dest"
          cp -r playwright-report/. "$dest"/ 2>/dev/null || true
          echo "report: $dest"
          echo "read it with: ssh rh1 'npx serve $dest'  (or scp it down)"
          {
            echo "### Playwright report (shard ${{ matrix.shard }})"
            echo ''
            echo "Kept on the runner, not uploaded: \`$dest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Anything older than a fortnight is not being looked at. `always()` so a run
      # that failed before the report existed still tidies up after the ones before it.
      - name: Prune old reports
        if: always()
        run: |
          find /opt/pheme-ci/playwright-reports -mindepth 1 -maxdepth 1 -type d \
            -mtime +14 -exec rm -rf {} + 2>/dev/null || true
